baseURL: https://plilab.github.io/jade/
languageCode: en-us
title: Jade

disableKinds:
  - taxonomy
  - term

outputFormats:
  Search:
    mediaType: application/json
    baseName: search-index
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - search
  section:
    - html

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderHooks:
      image:
        useEmbedded: fallback
      link:
        useEmbedded: always
    renderer:
      unsafe: true
  highlight:
    noClasses: false

module:
  mounts:
    - source: .
      target: content
      includeFiles:
        - '*.md'
        - '**/*.md'
    - source: _layouts
      target: layouts
    - source: _static
      target: static
    - source: assets
      target: static/assets
    - source: ../build/dokka/html
      target: static/api

params:
  description: A Java decompiler that aims for high reliability through extensive testing.
  repository: https://github.com/plilab/jade

